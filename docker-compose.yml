version: '3.8'

services:
  web:
    build: .
    container_name: web_app_service
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    restart: always